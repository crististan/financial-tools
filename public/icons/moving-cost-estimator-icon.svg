  <circle cx="48" cy="46" r="5" stroke="#09E789" stroke-width="2.5" fill="none"/>
  <!-- Boxes on truck -->
  <rect x="10" y="26" width="10" height="10" rx="1" stroke="#09E789" stroke-width="1.5" fill="none" opacity="0.7"/>
  <rect x="22" y="28" width="8" height="8" rx="1" stroke="#09E789" stroke-width="1.5" fill="none" opacity="0.7"/>
  <rect x="14" y="14" width="8" height="8" rx="1" stroke="#09E789" stroke-width="1.5" fill="none" opacity="0.5"/>
